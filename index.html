<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ochaworth Leadership and Community Development Initiative</title>
    <meta
      name="description"
      content="Ochaworth Leadership and Community Development Initiative is a non-profit organization providing food distribution, child education, medical support, and poverty reduction programs to communities in need."
    />
    <meta property="og:title" content="Ochaworth Leadership and Community Development Initiative" />
    <meta
      property="og:description"
      content="Donate, volunteer, or partner with Ochaworth to help transform lives through food distribution, education, medical support, and poverty reduction programs."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Hidden forms for Netlify Forms.
      Netlify's build bot only sees this static HTML file, never the React
      app that actually renders and submits these forms — so each real form
      (Newsletter, Contact, Become A Member, Become A Volunteer) needs a
      matching copy here with the same name and field names. This is what
      lets Netlify know these forms exist and what to expect, so it can
      capture submissions and (once turned on in the Netlify dashboard under
      Site configuration > Forms) email a notification for each one.
      These never display and are never filled in by a visitor directly.

      The Newsletter form ALSO, separately, posts to a Netlify Function (see
      netlify/functions/subscribe.js) that emails the subscriber a "you're
      now subscribed" confirmation via Resend. That's a second, independent
      step — this hidden form here is only what makes every subscriber's
      email address show up under Site configuration > Forms in Netlify, the
      same way Contact/Become A Member/Become A Volunteer already do.
    -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email"/>
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name"/>
      <input type="email" name="email"/>
      <input type="tel" name="phone"/>
      <input type="text" name="subject"/>
      <textarea name="message"></textarea>
    </form>
    <form name="become-a-member" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name"/>
      <input type="email" name="email"/>
      <input type="tel" name="phone"/>
      <input type="text" name="dob"/>
      <input type="text" name="occupation"/>
      <input type="text" name="address"/>
      <input type="text" name="country"/>
      <textarea name="message"></textarea>
    </form>
    <form name="become-a-volunteer" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name"/>
      <input type="email" name="email"/>
      <input type="tel" name="phone"/>
      <input type="text" name="dob"/>
      <input type="text" name="occupation"/>
      <input type="text" name="address"/>
      <input type="text" name="country"/>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
